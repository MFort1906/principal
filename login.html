<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Acesso ao Sistema</title>

    <!-- 🔥 usa seu CSS global -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h1>🔐 Acesso Restrito</h1>
        <p class="subtitle">Digite a senha para acessar o sistema</p>

        <div class="card">

            {% if erro %}
                <div class="error shake">{{ erro }}</div>
            {% endif %}

            <form method="POST">
                <div class="form-group">
                    <label>Senha</label>
                    <input 
                        type="password" 
                        name="password" 
                        placeholder="Digite sua senha"
                        class="{% if erro %}input-error{% endif %}"
                        required
                    >
                </div>

                <button type="submit">Entrar</button>
            </form>

        </div>

        <p class="subtitle" style="margin-top: 15px;">
            Sistema protegido
        </p>
    </div>

</body>
</html>
