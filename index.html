<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Scraper Tennant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* Ajustes específicos para o header com o botão do manual */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 30px;
            background-color: #f5f5f5;
            border-bottom: 1px solid #ddd;
            border-radius: 0 0 10px 10px;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.8em;
            margin: 0;
        }

        .header .manual-btn {
            background-color: #4a90e2;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .header .manual-btn:hover {
            background-color: #357ab7;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header atualizado -->
        <div class="top-bar">
            <h1>🌍 Scraper de Artigos</h1>
            <a href="{{ url_for('manual') }}" target="_blank" class="manual-btn">
                📘 Manual
            </a>
        </div>

        <p class="subtitle">Selecione o país e a quantidade de artigos (máx. 50)</p>

        <div class="card">
            <form id="scraper-form">
                <div class="form-group">
                    <label for="pais">País</label>
                    <select id="pais" name="pais" required></select>
                </div>

                <div class="form-group">
                    <label for="quantidade">Quantidade de artigos</label>
                    <input 
                        type="number" 
                        id="quantidade" 
                        name="quantidade" 
                        min="1" 
                        max="50" 
                        value="1"
                        required
                    >
                </div>

                <div id="aviso-quantidade" class="error" style="display:none;">Quantidade máxima permitida: 50</div>

                <button type="submit" id="submit-btn">Rodar Scraper</button>
            </form>
        </div>

        <div id="status" class="status" style="display:none;">
            <div class="loading">
                <div class="spinner"></div>
                <span id="status-text"></span>
            </div>
        </div>

        <div id="resultado" class="result-card" style="display:none;">
            <div class="success">Artigos processados com sucesso!</div>
            <div id="downloads" class="downloads"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
