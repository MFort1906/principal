<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso — Tennant</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        :root {
            --c1: #00c8ff; --c2: #0059ff; --bg: #04091a;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background: var(--bg);
            background-image:
                radial-gradient(ellipse 90% 55% at 50% -8%, rgba(0,80,255,.2) 0%, transparent 68%),
                radial-gradient(ellipse 55% 45% at 85% 95%, rgba(0,200,255,.07) 0%, transparent 60%);
            display: flex; align-items: center; justify-content: center;
            font-family: 'DM Sans', sans-serif;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(0,200,255,.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,200,255,.025) 1px, transparent 1px);
            background-size: 52px 52px;
            pointer-events: none;
        }

        .login-wrap {
            position: relative; z-index: 1;
            width: 100%; max-width: 400px; padding: 24px;
            display: flex; flex-direction: column;
            align-items: center; gap: 28px;
        }

        /* LOGO */
        .login-logo {
            display: flex; flex-direction: column;
            align-items: center; gap: 8px;
            animation: slideDown .6s cubic-bezier(.16,1,.3,1) both;
        }
        .logo-glow-wrap {
            position: relative; display: inline-flex;
        }
        .logo-glow-wrap::before {
            content: '';
            position: absolute; inset: -20px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,200,255,.2) 0%, transparent 70%);
            animation: logoPulse 3s ease-in-out infinite;
        }
        .login-logo img {
            position: relative; z-index: 1;
            height: 80px; width: auto;
            filter:
                drop-shadow(0 0 14px rgba(0,200,255,.65))
                drop-shadow(0 0 48px rgba(0,100,255,.3));
            image-rendering: crisp-edges;
        }
        .login-logo-sub {
            font-size: 10px; font-weight: 600; letter-spacing: 5px;
            text-transform: uppercase; color: rgba(0,200,255,.45);
        }

        /* CARD */
        .login-card {
            width: 100%;
            background: rgba(255,255,255,.035);
            border: 1px solid rgba(0,200,255,.1);
            border-radius: 24px; padding: 36px 32px 32px;
            backdrop-filter: blur(24px);
            box-shadow:
                0 0 0 1px rgba(255,255,255,.04) inset,
                0 1px 0 rgba(255,255,255,.07) inset,
                0 32px 80px rgba(0,0,0,.6),
                0 0 60px rgba(0,80,255,.06);
            animation: slideUp .6s .12s cubic-bezier(.16,1,.3,1) both;
        }

        .card-head { text-align: center; margin-bottom: 28px; }
        .card-icon {
            width: 54px; height: 54px; border-radius: 16px;
            background: linear-gradient(135deg, rgba(0,200,255,.12), rgba(0,80,255,.08));
            border: 1px solid rgba(0,200,255,.2);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 18px; font-size: 24px;
            box-shadow: 0 0 28px rgba(0,200,255,.14), 0 4px 16px rgba(0,0,0,.3);
        }
        .card-title {
            font-family: 'Syne', sans-serif;
            font-size: 22px; font-weight: 800; color: #fff; letter-spacing: -.3px;
        }
        .card-sub { font-size: 13px; color: rgba(255,255,255,.38); margin-top: 7px; line-height: 1.5; }

        /* Error */
        .login-error {
            background: rgba(255,55,55,.07);
            border: 1px solid rgba(255,55,55,.22);
            border-radius: 12px; padding: 11px 15px;
            color: #ff7070; font-size: 13px;
            margin-bottom: 18px; display: flex; align-items: center; gap: 8px;
        }

        /* Field */
        .login-field { margin-bottom: 16px; }
        .login-label {
            display: block; font-size: 11px; font-weight: 600;
            letter-spacing: .8px; text-transform: uppercase;
            color: rgba(255,255,255,.35); margin-bottom: 8px;
        }
        .login-input {
            width: 100%; padding: 13px 16px;
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 12px; color: #fff;
            font-size: 14px; font-family: 'DM Sans', sans-serif;
            outline: none;
            transition: border .2s, box-shadow .2s, background .2s;
        }
        .login-input::placeholder { color: rgba(255,255,255,.18); }
        .login-input:focus {
            border-color: rgba(0,200,255,.4);
            background: rgba(0,200,255,.04);
            box-shadow: 0 0 0 3px rgba(0,200,255,.09);
        }

        /* Button */
        .login-btn {
            all: unset;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; padding: 15px; margin-top: 8px; cursor: pointer;
            border-radius: 14px;
            background: linear-gradient(135deg, #00c8ff 0%, #0059ff 100%);
            font-size: 13px; font-weight: 700; letter-spacing: 1.2px;
            text-transform: uppercase; color: #001230;
            position: relative; overflow: hidden;
            box-shadow: 0 0 40px rgba(0,200,255,.28), 0 8px 28px rgba(0,80,255,.4), 0 1px 0 rgba(255,255,255,.2) inset;
            transition: transform .18s, box-shadow .2s;
        }
        .login-btn::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,.18) 0%, transparent 60%);
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 60px rgba(0,200,255,.45), 0 14px 36px rgba(0,80,255,.55), 0 1px 0 rgba(255,255,255,.2) inset;
        }
        .login-btn:active { transform: translateY(0); }

        /* S960 preview */
        .login-machine {
            width: 100%; display: flex; justify-content: center; margin-top: -8px;
            animation: fadeIn .6s .3s both;
        }
        .login-machine img {
            height: 110px; width: auto; opacity: .55;
            filter: drop-shadow(0 6px 20px rgba(0,0,0,.5)) saturate(0.6);
        }

        .login-footer {
            font-size: 11px; color: rgba(255,255,255,.18);
            letter-spacing: .6px; animation: fadeIn .5s .4s both;
        }

        @keyframes slideDown  { from { opacity:0; transform:translateY(-20px); } to { opacity:1; transform:none; } }
        @keyframes slideUp    { from { opacity:0; transform:translateY(20px);  } to { opacity:1; transform:none; } }
        @keyframes fadeIn     { from { opacity:0; }                             to { opacity:1; } }
        @keyframes logoPulse  { 0%,100%{ opacity:.5; transform:scale(1); }      50%{ opacity:1; transform:scale(1.08); } }
        .shake { animation: shake .4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }
    </style>
</head>
