<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Acesso ao Sistema</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h1 style="text-align: center; margin-bottom: 5px;">🔐 Acesso Restrito</h1>
        <p class="subtitle">Digite a senha para acessar o sistema</p>

        <div class="card">

            {% if erro %}
                <div class="error shake" style="margin-bottom: 15px;">
                    ⚠️ {{ erro }}
                </div>
            {% endif %}

            <form method="POST">
                <div class="form-group">
                    <label>Senha de Acesso</label>
                    <input 
                        type="password" 
                        name="password" 
                        placeholder="Digite sua senha"
                        class="{% if erro %}input-error{% endif %}"
                        required
                        autofocus
                    >
                </div>

                <button type="submit" style="width: 100%;">Entrar no Painel</button>
            </form>

        </div>

        <p class="subtitle" style="margin-top: 20px; font-size: 11px;">
            Sistema de Automação Tennant &copy; 2026
        </p>
    </div>

</body>
</html>
