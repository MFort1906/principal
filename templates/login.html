<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso — Tennant</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg:    #07080e;
            --s1:    #0a0d18;
            --s2:    #0e1220;
            --s3:    #141829;
            --b0:    rgba(255,255,255,0.055);
            --b1:    rgba(255,255,255,0.09);
            --cyan:  #00ccff;
            --cyan2: #0055ff;
            --cdim:  rgba(0,204,255,0.09);
            --cglo:  rgba(0,204,255,0.20);
            --crng:  rgba(0,204,255,0.14);
            --red:   #ff3355;
            --rdim:  rgba(255,51,85,0.07);
            --rbdr:  rgba(255,51,85,0.20);
            --tp:    #e8eeff;
            --ts:    #566080;
            --tm:    #2a3450;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Syne', sans-serif;
            background: var(--bg);
            background-image:
                radial-gradient(ellipse 120% 70% at 50% -15%, rgba(0,55,230,.28) 0%, transparent 62%),
                radial-gradient(ellipse 50% 40% at 95% 100%,  rgba(0,200,255,.06) 0%, transparent 55%);
            color: var(--tp);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* grid de fundo */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,.012) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.012) 1px, transparent 1px);
            background-size: 52px 52px;
            pointer-events: none;
        }

        canvas#bg-canvas {
            position: fixed; inset: 0;
            z-index: 0; pointer-events: none;
        }

        /* ── WRAP ── */
        .login-wrap {
            position: relative; z-index: 1;
            width: 100%; max-width: 420px;
            padding: 32px 22px 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            animation: riseUp .9s cubic-bezier(0.16,1,0.3,1) forwards;
        }

        @keyframes riseUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── LOGO ── */
        .logo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 36px;
        }

        .logo-svg-wrap {
            padding: 8px 14px;
            background: var(--s2);
            border: 1px solid var(--b1);
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0,150,200,.15), 0 0 60px rgba(0,80,255,.08);
        }

        .logo-sub-text {
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(0,204,255,.4);
        }

        /* ── CARD ── */
        .login-card {
            width: 100%;
            background: var(--s1);
            border: 1px solid var(--b0);
            border-radius: 28px;
            padding: 36px 32px 32px;
            position: relative;
            overflow: hidden;
        }

        /* shimmer line no topo */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 10%; right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0,204,255,.4), transparent);
        }

        /* inner glow */
        .login-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse 80% 45% at 50% 0%, rgba(0,200,255,.035) 0%, transparent 70%);
            pointer-events: none;
        }

        /* ── CABEÇALHO ── */
        .card-head {
            text-align: center;
            margin-bottom: 30px;
        }

        .lock-icon {
            width: 56px; height: 56px;
            border-radius: 15px;
            background: var(--cdim);
            border: 1px solid var(--crng);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            font-size: 22px;
            color: var(--cyan);
            box-shadow: 0 0 28px var(--cglo);
        }

        .card-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 28px;
            letter-spacing: 2px;
            color: var(--tp);
        }

        .card-sub {
            font-size: 13px;
            color: var(--ts);
            margin-top: 7px;
            line-height: 1.5;
        }

        /* ── ERRO ── */
        .login-error {
            display: flex;
            align-items: center;
            gap: 9px;
            background: var(--rdim);
            border: 1px solid var(--rbdr);
            border-radius: 10px;
            padding: 12px 15px;
            color: var(--red);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 20px;
        }

        /* ── CAMPO ── */
        .field-wrap {
            margin-bottom: 22px;
        }

        .field-lbl {
            display: block;
            font-size: 9.5px;
            font-weight: 700;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            color: var(--ts);
            margin-bottom: 9px;
        }

        .pw-wrap {
            position: relative;
        }

        .field-input {
            display: block;
            width: 100%;
            padding: 14px 46px 14px 16px;
            background: var(--s2);
            border: 1px solid var(--b0);
            border-radius: 14px;
            color: var(--tp);
            font-family: 'Syne', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color .2s, box-shadow .2s, background .2s;
            -webkit-appearance: none;
        }

        .field-input::placeholder { color: var(--tm); }

        .field-input:focus {
            border-color: var(--cyan);
            background: var(--s3);
            box-shadow: 0 0 0 3px var(--crng), 0 0 22px rgba(0,200,255,.05);
        }

        .pw-toggle {
            position: absolute;
            right: 14px; top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--tm);
            font-size: 14px;
            padding: 4px;
            line-height: 1;
            transition: color .2s;
        }

        .pw-toggle:hover { color: var(--cyan); }

        /* ── BOTÃO ── */
        .login-btn {
            /* reset completo — sem herança problemática */
            display: -webkit-box;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-align: center;
                -ms-flex-align: center;
                    align-items: center;
            -webkit-box-pack: center;
                -ms-flex-pack: center;
                    justify-content: center;
            gap: 9px;

            width: 100%;
            padding: 15px 20px;
            margin-top: 4px;

            background: linear-gradient(135deg, var(--cyan) 0%, #006aff 100%);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            position: relative;
            overflow: hidden;

            font-family: 'Syne', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #000d1a;
            text-align: center;
            -webkit-font-smoothing: antialiased;
            vertical-align: middle;
            line-height: 1;

            box-shadow:
                0 0 38px rgba(0,200,255,.22),
                0 6px 22px rgba(0,0,0,.55);

            -webkit-transition: -webkit-transform .15s, box-shadow .2s;
            transition: transform .15s, box-shadow .2s;

            /* garantir que o botão não distorça */
            -webkit-box-sizing: border-box;
            box-sizing: border-box;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        /* reflexo interno */
        .login-btn::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,.22) 0%, transparent 55%);
            border-radius: 14px;
            opacity: 0;
            transition: opacity .2s;
        }

        .login-btn:hover::before { opacity: 1; }

        .login-btn:hover {
            -webkit-transform: translateY(-2px);
            transform: translateY(-2px);
            box-shadow:
                0 0 56px rgba(0,200,255,.48),
                0 12px 34px rgba(0,0,0,.6);
        }

        .login-btn:active {
            -webkit-transform: translateY(0);
            transform: translateY(0);
        }

        .login-btn i {
            position: relative; z-index: 1;
            font-size: 14px;
            pointer-events: none;
        }

        .login-btn span {
            position: relative; z-index: 1;
            pointer-events: none;
        }

        /* ── S960 DECORATION ── */
        .machine-deco {
            margin-top: 32px;
            opacity: 0.7;
            filter: drop-shadow(0 0 14px rgba(0,200,255,.18));
        }

        /* ── FOOTER ── */
        .login-footer {
            margin-top: 24px;
            font-size: 11px;
            color: var(--tm);
            letter-spacing: .6px;
            text-align: center;
        }

        /* ── ANIMAÇÕES ── */
        .shake {
            animation: shake .4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25%      { transform: translateX(-10px); }
            75%      { transform: translateX(10px); }
        }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="login-wrap">

    <!-- LOGO -->
    <div class="logo-area">
        <div class="logo-svg-wrap">
            <svg width="108" height="48" viewBox="0 0 108 48" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="54" cy="24" rx="52" ry="22" fill="none" stroke="#0099cc" stroke-width="2.2"/>
                <ellipse cx="54" cy="24" rx="46" ry="17" fill="white"/>
                <ellipse cx="54" cy="24" rx="46" ry="17" fill="none" stroke="#0099cc" stroke-width="1.8"/>
                <text x="54" y="29"
                      text-anchor="middle"
                      font-family="Arial Black, Impact, sans-serif"
                      font-size="14.5" font-weight="900"
                      fill="#0099cc" letter-spacing="1.5">TENNANT</text>
                <text x="99" y="13" font-family="Arial,sans-serif" font-size="7" fill="#0099cc">®</text>
            </svg>
        </div>
        <span class="logo-sub-text">Automation Platform</span>
    </div>

    <!-- CARD -->
    <div class="login-card">

        <div class="card-head">
            <div class="lock-icon">
                <i class="fa-solid fa-lock"></i>
            </div>
            <div class="card-title">Acesso Restrito</div>
            <div class="card-sub">Digite a senha para entrar no painel</div>
        </div>

        {% if erro %}
            <div class="login-error shake">
                <i class="fa-solid fa-triangle-exclamation"></i>
                {{ erro }}
            </div>
        {% endif %}

        <form method="POST" autocomplete="off">
            <div class="field-wrap">
                <label class="field-lbl" for="password">
                    <i class="fa-solid fa-key" style="opacity:.4;margin-right:5px;"></i>
                    Senha de acesso
                </label>
                <div class="pw-wrap">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="••••••••"
                        class="field-input {% if erro %}shake{% endif %}"
                        required autofocus
                    >
                    <button type="button" class="pw-toggle" onclick="togglePw()" tabindex="-1" aria-label="Mostrar senha">
                        <i class="fa-regular fa-eye" id="pw-icon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="login-btn">
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
                <span>Entrar no painel</span>
            </button>
        </form>

    </div>

    <!-- S960 mini decorativa -->
    <div class="machine-deco">
        <svg viewBox="0 0 220 100" width="220" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="lt" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#00d4e8"/>
                    <stop offset="100%" stop-color="#007e92"/>
                </linearGradient>
                <linearGradient id="lg" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#7a8fa0"/>
                    <stop offset="100%" stop-color="#4a5a68"/>
                </linearGradient>
                <linearGradient id="lb" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#c8a050"/>
                    <stop offset="100%" stop-color="#8a6020"/>
                </linearGradient>
            </defs>
            <!-- rodas -->
            <circle cx="68" cy="82" r="13" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
            <circle cx="68" cy="82" r="7"  fill="#2a2a2a"/>
            <circle cx="152" cy="82" r="13" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
            <circle cx="152" cy="82" r="7"  fill="#2a2a2a"/>
            <!-- base -->
            <rect x="52" y="65" width="116" height="18" rx="5" fill="#253545"/>
            <!-- corpo teal -->
            <path d="M55,32 Q58,22 70,20 L148,20 Q164,20 166,34 L172,65 L50,65 Z" fill="url(#lt)"/>
            <!-- reflexo -->
            <path d="M66,23 Q110,20 148,22 L152,32 Q110,30 64,32 Z" fill="white" opacity="0.12"/>
            <!-- estrutura cabine -->
            <rect x="60" y="10" width="6" height="28" rx="2" fill="url(#lg)"/>
            <rect x="154" y="10" width="6" height="28" rx="2" fill="url(#lg)"/>
            <rect x="76" y="16" width="5" height="22" rx="2" fill="url(#lg)"/>
            <rect x="139" y="16" width="5" height="22" rx="2" fill="url(#lg)"/>
            <rect x="58" y="8" width="104" height="7" rx="3" fill="url(#lg)"/>
            <rect x="74" y="14" width="72" height="6" rx="2" fill="url(#lg)"/>
            <!-- vidro -->
            <rect x="78" y="18" width="64" height="30" rx="3" fill="#c8f0ff" opacity="0.1" stroke="#a0d0e8" stroke-width="0.7"/>
            <!-- volante -->
            <circle cx="118" cy="34" r="9" fill="none" stroke="#2a3a4a" stroke-width="3"/>
            <line x1="118" y1="25" x2="118" y2="43" stroke="#2a3a4a" stroke-width="2"/>
            <line x1="109" y1="34" x2="127" y2="34" stroke="#2a3a4a" stroke-width="2"/>
            <circle cx="118" cy="34" r="3" fill="#1a2a3a"/>
            <!-- logo s960 -->
            <text x="86" y="57" font-family="Arial Black,sans-serif" font-size="8" font-weight="900" fill="white" opacity="0.9">S960</text>
            <!-- logo tennant oval -->
            <ellipse cx="130" cy="54" rx="16" ry="8" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
            <ellipse cx="130" cy="54" rx="13.5" ry="6.5" fill="white" opacity="0.88"/>
            <text x="130" y="57" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="4" font-weight="900" fill="#0099cc" letter-spacing="0.5">TENNANT</text>
            <!-- botão amarelo -->
            <circle cx="110" cy="18" r="4" fill="#f5c518" stroke="#d4a800" stroke-width="0.8"/>
            <!-- escovas -->
            <line x1="55" y1="72" x2="44" y2="84" stroke="#4a5a68" stroke-width="3" stroke-linecap="round"/>
            <circle cx="42" cy="88" r="10" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
            <ellipse cx="42" cy="88" rx="3" ry="8" fill="url(#lb)" opacity="0.9"/>
            <ellipse cx="42" cy="88" rx="3" ry="8" fill="url(#lb)" opacity="0.9" transform="rotate(45,42,88)"/>
            <ellipse cx="42" cy="88" rx="3" ry="8" fill="url(#lb)" opacity="0.9" transform="rotate(90,42,88)"/>
            <ellipse cx="42" cy="88" rx="3" ry="8" fill="url(#lb)" opacity="0.9" transform="rotate(135,42,88)"/>
            <circle cx="42" cy="88" r="4" fill="#1a1a1a"/>
            <line x1="165" y1="72" x2="176" y2="84" stroke="#4a5a68" stroke-width="3" stroke-linecap="round"/>
            <circle cx="178" cy="88" r="10" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
            <ellipse cx="178" cy="88" rx="3" ry="8" fill="url(#lb)" opacity="0.9"/>
            <ellipse cx="178" cy="88" rx="3" ry="8" fill="url(#lb)" opacity="0.9" transform="rotate(45,178,88)"/>
            <ellipse cx="178" cy="88" rx="3" ry="8" fill="url(#lb)" opacity="0.9" transform="rotate(90,178,88)"/>
            <ellipse cx="178" cy="88" rx="3" ry="8" fill="url(#lb)" opacity="0.9" transform="rotate(135,178,88)"/>
            <circle cx="178" cy="88" r="4" fill="#1a1a1a"/>
        </svg>
    </div>

    <p class="login-footer">Sistema de Automação Tennant &copy; 2026</p>

</div>

<script>
function togglePw() {
    const inp  = document.getElementById('password');
    const icon = document.getElementById('pw-icon');
    if (inp.type === 'password') {
        inp.type = 'text';
        icon.className = 'fa-regular fa-eye-slash';
    } else {
        inp.type = 'password';
        icon.className = 'fa-regular fa-eye';
    }
}

/* partículas */
const canvas = document.getElementById('bg-canvas');
const ctx    = canvas.getContext('2d');
let W, H, pts = [];

function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
function init() {
    pts = Array.from({length: 55}, () => ({
        x: Math.random()*W, y: Math.random()*H,
        r: Math.random()*1.3+.3,
        vx: (Math.random()-.5)*.18, vy: (Math.random()-.5)*.18,
        o: Math.random()*.28+.04
    }));
}
function draw() {
    ctx.clearRect(0,0,W,H);
    for (const p of pts) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.fillStyle = `rgba(0,200,255,${p.o})`;
        ctx.fill();
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
        if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
    }
    requestAnimationFrame(draw);
}
resize(); init(); draw();
window.addEventListener('resize', () => { resize(); init(); });
</script>

</body>
</html>
