    content = content.replace(old_css_block.group(0), '''/* ── X4 ROVR SVG CARTOON ── */
        .machine-svg { width:100%; max-width:380px; display:block; margin:0 auto; overflow:visible; }

        /* Bounce da máquina */
        .ride-group {
            animation: ride-bounce 0.6s ease-in-out infinite alternate;
            transform-origin: 180px 220px;
        }
        @keyframes ride-bounce {
            from { transform: translateY(0px); }
            to   { transform: translateY(-7px); }
        }
        /* Ground strips deslizando */
        .ground-strip { animation: gslide .55s linear infinite; }
        @keyframes gslide { from{transform:translateX(0)} to{transform:translateX(-49px)} }

        /* Rodas girando */
        .w-rear  { animation: wspin .5s linear infinite; }
        .w-front { animation: wspin .5s linear infinite; }
        /* Escovas girando */
        .brush   { animation: bspin .35s linear infinite; }
        .brush2  { animation: bspin .35s linear infinite reverse; }
        @keyframes wspin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
        @keyframes bspin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }''')
