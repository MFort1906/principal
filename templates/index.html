<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W.S.T.B — Tennant Scraper</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        /* ── LOGO HEADER ── */
        .logo-icon { overflow: visible !important; }
        .logo-sub { display: none; }

        /* ── S960 MACHINE ── */
        .s960-wrap {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            width: 100%;
            max-width: 380px;
            margin: 0 auto;
        }
        .s960-img {
            width: 100%;
            max-width: 380px;
            height: auto;
            display: block;
            image-rendering: auto;
            animation: s960-bounce 0.55s ease-in-out infinite alternate,
                       s960-drive 0.55s ease-in-out infinite alternate;
            filter: drop-shadow(0 18px 28px rgba(0,0,0,0.55))
                    drop-shadow(0 0 40px rgba(0,200,255,0.12));
        }
        @keyframes s960-bounce {
            from { transform: translateY(0px); }
            to   { transform: translateY(-7px); }
        }

        .s960-shadow {
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 65%;
            height: 14px;
            background: radial-gradient(ellipse, rgba(0,200,255,0.22) 0%, transparent 70%);
            border-radius: 50%;
            animation: shadow-pulse 0.55s ease-in-out infinite alternate;
        }
        @keyframes shadow-pulse {
            from { transform: translateX(-50%) scaleX(1);   opacity: 0.7; }
            to   { transform: translateX(-50%) scaleX(0.8); opacity: 0.3; }
        }

        .s960-bubbles {
            position: absolute;
            left: 0;
            bottom: 10px;
            width: 80px;
            height: 80px;
            overflow: visible;
            pointer-events: none;
        }

        /* Chão */
        .machine-scene::before {
            content: '';
            display: block;
            width: 70%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(0,200,255,0.15), transparent);
            margin: 0 auto 0;
            border-radius: 2px;
        }
    </style>

</head>

    <script>
        // Nudge quantity
        function nudge(dir) {
            const inp = document.getElementById('quantidade');
            const v = parseInt(inp.value) + dir;
            if (v >= 1 && v <= 50) inp.value = v;
        }

        // Subtle particle canvas
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let W, H, particles = [];

        function resize() {
            W = canvas.width  = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }

        function initParticles() {
            particles = Array.from({length: 55}, () => ({
                x: Math.random() * W,
                y: Math.random() * H,
                r: Math.random() * 1.4 + 0.3,
                vx: (Math.random() - 0.5) * 0.22,
                vy: (Math.random() - 0.5) * 0.22,
                o: Math.random() * 0.35 + 0.05
            }));
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            for (const p of particles) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0,200,255,${p.o})`;
                ctx.fill();
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0) p.x = W;
                if (p.x > W) p.x = 0;
                if (p.y < 0) p.y = H;
                if (p.y > H) p.y = 0;
            }
            requestAnimationFrame(draw);
        }

        resize(); initParticles(); draw();
        window.addEventListener('resize', () => { resize(); initParticles(); });
    </script>
