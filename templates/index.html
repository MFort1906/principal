<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>W.S.T.B.R 2000</title>

    <!-- Fonte mais premium -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">

        <!-- 🔝 HEADER -->
        <div class="top-bar">
            <div>
                <h1>🌍 W.S.T.B.R 2000</h1>
                <p style="font-size:12px; color:#94a3b8;">
                    Plataforma de scraping e tradução editorial
                </p>
            </div>

            <a href="{{ url_for('manual') }}" target="_blank" class="manual-btn">
                📘 Manual
            </a>
        </div>

        <!-- 🧭 SUBTÍTULO -->
        <p class="subtitle">
            Configure os parâmetros e inicie o processamento dos artigos
        </p>

        <!-- 📦 CARD PRINCIPAL -->
        <div class="card">
            <form id="scraper-form">

                <div class="form-group">
                    <label for="pais">País de origem</label>
                    <select id="pais" name="pais" required></select>
                </div>

                <div class="form-group">
                    <label for="quantidade">Quantidade de artigos</label>
                    <input 
                        type="number" 
                        id="quantidade" 
                        name="quantidade" 
                        min="1" 
                        max="50" 
                        value="1"
                        required
                    >
                </div>

                <div id="aviso-quantidade" class="error" style="display:none;">
                    ⚠️ Limite máximo: 50 artigos
                </div>

                <button type="submit" id="submit-btn">
                    🚀 Iniciar processamento
                </button>

            </form>
        </div>

        <!-- ⏳ STATUS -->
        <div id="status" class="status" style="display:none;">
            <div class="loading">
                <div class="spinner"></div>
                <span id="status-text">Processando...</span>
            </div>
        </div>

        <!-- ✅ RESULTADO -->
        <div id="resultado" class="result-card" style="display:none;">
            <div class="success">
                ✅ Processamento concluído com sucesso
            </div>

            <div style="font-size:13px; color:#94a3b8; text-align:center; margin-bottom:10px;">
                Os arquivos estão prontos para download
            </div>

            <div id="downloads" class="downloads"></div>
        </div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
